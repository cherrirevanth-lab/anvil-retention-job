name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/
      - name: Self-verification
        run: node verify.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence.json
          if-no-files-found: error
